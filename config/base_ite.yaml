# =====================================================================
#   base_ite.yaml  —  PROJECT recipe: the proven base/bootstrap chain
# =====================================================================
#   Restores the original writeStory base_ite steps that the npm package
#   stripped out. These four steps have been in production for months:
#     reset_base_environment_ite → download_model (git+lfs) →
#     quantize_model (MLX 4-bit) → seed_story_sqlite.
#
#   resolveConfigPath resolves <BASE>/config/base_ite.yaml before the
#   package's stepless copy, so selecting base_ite runs THIS. No other
#   recipe `include:`s base_ite, so these steps don't bleed into them.
#
#   NOTE on the model path: build/model + build/model4 are CWD-relative.
#   Run base_ite from the project root (BASE) to populate the SHARED
#   build/model4 that pipes reference via ../../build/model4.
#
run:
  model: Qwen/Qwen3-4B-Instruct-2507
  output_dir: out
  data_dir: data
  training_dir: build/train
  loraLand: build/model
  debug_s: false
  debug_mlx: false
  debug_sql: false

artifacts:
  stories_md:
    source: data/jim.md
  story_seed_ids:
    target: out/story_seed_ids.json

reset_base_environment_ite:
  run: story/reset_base_environment_ite.coffee
  depends_on: []
  needs: []
  makes: []

download_model:
  run: story/hf_download.coffee
  depends_on: [reset_base_environment_ite]
  needs: []
  makes: []
  loraLand: build/model

quantize_model:
  debug_s: true
  run: kag_oracle/quantize_model.coffee
  depends_on: [download_model]
  needs: []
  makes: []
  source_model_dir: build/model
  quantized_model_dir: build/model4
  quantized_model_memo_key: quantizedModelDir
  mlx:
    quantize: null
    q-bits: 4

seed_story_sqlite:
  run: kag_oracle_ite/seed_story_sqlite.coffee
  depends_on: [quantize_model]
  needs: [stories_md]
  makes: [story_seed_ids]
