# =====================================================================
#   story.yaml  —  diary_ite evolved to output a chapter (Phase 1)
# =====================================================================
#   Copy of the shipped diary_ite recipe with one new step inserted:
#   `story_spine` — a structural planner that reads story_parts + a
#   handful of atom selections and emits story_spine_json, a strict
#   JSON plan a future prose stage can expand into a chapter.
#
#   Phase 1: story_spine is a sidecar (nothing downstream consumes it
#   yet). The diary generation branch continues to run unchanged.
#   Phase 2 will wire story_spine_json into build_diary_prompt_ite.
#
#   Lives at <BASE>/config/story.yaml — shadows any runner-bundled
#   config/story.yaml at <EXEC>/config/. Activated by
#   pipes/story/override.yaml (`pipeline: story`).

run:
  model: Qwen/Qwen3-4B-Instruct-2507
  output_dir: out
  data_dir: data
  training_dir: build/train
  loraLand: build/model
  debug_s: false
  debug_mlx: false
  debug_sql: false

artifacts:
  story_library:
    target: out/story_library.json
  story_recipe:
    target: out/story_recipe.json
  story_parts:
    target: out/story_parts.json
  diary_kag:
    target: out/diary_kag.json
  diary_prompt_text:
    target: out/diary_prompt.txt
  diary_adapted_raw:
    target: out/diary_adapted_raw.txt
  diary_base_raw:
    target: out/diary_base_raw.txt
  diary_adapted_meta:
    target: out/diary_adapted_meta.json
  diary_base_meta:
    target: out/diary_base_meta.json
  diary_adapted_text:
    target: out/diary_adapted.txt
  diary_base_text:
    target: out/diary_base.txt
  story_spine_json:
    target: out/story_spine.json
  story_beats_json:
    target: out/story_beats.json
  scene_plan_json:
    target: out/scene_plan.json

load_library:
  run: story/load_library.coffee
  depends_on: []
  needs: []
  makes: [story_library]
  library_file: data/jim_story_library.yaml

select_story_recipe:
  run: story/select_story_recipe.coffee
  depends_on: [load_library]
  needs: [story_library]
  makes: [story_recipe]
  scene: [ UI_dropdown, data/jim_story_library.yaml/library/scenes ]
  arrival: [ UI_dropdown, data/jim_story_library.yaml/library/characters ]
  disturbance: [ UI_dropdown, data/jim_story_library.yaml/library/disturbances ]
  reflection: [ UI_dropdown, data/jim_story_library.yaml/library/reflections ]
  realization: [ UI_dropdown, data/jim_story_library.yaml/library/realizations ]

resolve_story_parts:
  run: story/resolve_story_parts.coffee
  depends_on: [select_story_recipe]
  needs: [story_library, story_recipe]
  makes: [story_parts]

# ─── Story Spine (Phase 2 — upstream of the prompt builder) ────────
# Local sacred step at pipes/story/scripts/story_spine.coffee. Runner
# resolves `run:` under CWD/scripts/ first, so the local script wins
# over any similarly-named runner-bundled script.
#
# story_spine now feeds build_diary_prompt_ite (Phase 2 wiring below),
# so it runs BEFORE the prompt builder — which naturally serializes it
# against generate_diary_without_adapter_ite (they can never overlap
# on the shared getSession cache).
story_spine:
  run: story_spine.coffee
  depends_on: [resolve_story_parts]
  needs: [story_parts]
  makes: [story_spine_json]

  # Character slots (protagonist required; others may be left blank).
  protagonist: [ UI_dropdown, data/jim_story_library.yaml/story_atoms/characters ]
  antagonist:  [ UI_dropdown, data/jim_story_library.yaml/story_atoms/characters ]
  witness:     [ UI_dropdown, data/jim_story_library.yaml/story_atoms/characters ]

  # Dramatic axis (all required).
  external_problem:    [ UI_dropdown, data/jim_story_library.yaml/story_atoms/external_problems ]
  internal_obstacle:   [ UI_dropdown, data/jim_story_library.yaml/story_atoms/internal_obstacles ]
  missed_opportunity:  [ UI_dropdown, data/jim_story_library.yaml/story_atoms/missed_opportunities ]
  primary_consequence: [ UI_dropdown, data/jim_story_library.yaml/story_atoms/primary_consequences ]

  # Interpretive lens through which the finished chapter reads.
  lens: [ UI_dropdown, data/jim_story_library.yaml/story_atoms/lenses ]

  # Fast in-process node-mlx generation (S.callLLM), NOT the Python
  # subprocess path (S.callMLX). Same knobs generate_diary_*_ite use.
  quantized_model_dir: build/model4
  llm:
    # 2000 truncated the response mid-scene (Generation: 2000/2000 tokens
    # in the failing run). 4000 is comfortable headroom for the full
    # 4-section structured plan; raise if the model still runs out.
    # Actual spine output was ~2.4KB at maxTokens 4000 — plenty of headroom
    # to cut. Wall-clock is roughly linear in output tokens generated.
    maxTokens: 2500
    # temperature: 0 triggers a div-by-zero deep in @frost-beta/llm's
    # sampler ("Error converting 'this' to mx.array"). 0.05 is
    # near-deterministic without hitting the numerical edge case.
    temperature: 0.05
    topP: 0.95

# ─── Story Beats (Increment b — abstract dramatic movements) ────────
# Second planning layer. Reads story_spine_json (dramatic necessity)
# and emits story_beats_json — an ordered list of 3–5 abstract beats,
# each with a first-class conflict {need, protection}. Beats never
# stage; Scene Planner (Increment c) is the layer that decides which
# specific cast member embodies which beat obligation.
#
# Serializes against story_spine on the shared getSession cache (both
# use build/model4 with no adapter). No new UI knobs — the beats are
# purely a function of the Spine.
story_beats:
  run: story_beats.coffee
  depends_on: [story_spine]
  needs: [story_spine_json]
  makes: [story_beats_json]
  quantized_model_dir: build/model4
  llm:
    # Actual beats output was ~4.5KB at maxTokens 3000 — trim.
    maxTokens: 2000
    temperature: 0.05
    topP: 0.95

# ─── Scene Planner (Increment c — concrete staging) ─────────────────
# Fourth layer. Reads story_beats_json (abstract movements + carried
# cast/lens/spine_ref) and produces scene_plan_json: 2–3 Scene
# Candidates per beat and one selected candidate per beat.
#
# This is the FIRST layer allowed to assign specific cast to dramatic
# roles, pick locations, and describe physical action. Cast discipline
# is enforced in code after the LLM call: present_cast is filtered to
# names that exist in the spine's cast block. Unnamed passersby are
# free text inside `action`/`setting`.
#
# Serializes against story_spine and story_beats on the shared
# getSession cache (all three use build/model4 with no adapter).
scene_planner:
  run: scene_planner.coffee
  depends_on: [story_beats]
  needs: [story_beats_json]
  makes: [scene_plan_json]
  quantized_model_dir: build/model4
  llm:
    # After dropping the standalone `candidates` array (2026-08-01
    # revision) the schema is roughly half its previous size. 3000
    # tokens is comfortable headroom for ~4 selected scenes with tight
    # 1–2 sentence fields.
    maxTokens: 3000
    temperature: 0.1
    topP: 0.95

collect_diary_kag_ite:
  run: diary_ite/collect_diary_kag_ite.coffee
  depends_on: [resolve_story_parts]
  needs: [story_parts]
  makes: [diary_kag]
  per_event_match_limit: 3
  scene_emotion: [ UI_dropdown, db/kag_keywords, "" ]
  arrival_emotion: [ UI_dropdown, db/kag_keywords, "" ]
  disturbance_emotion: [ UI_dropdown, db/kag_keywords, "" ]
  reflection_emotion: [ UI_dropdown, db/kag_keywords, "" ]
  realization_emotion: [ UI_dropdown, db/kag_keywords, "" ]

build_diary_prompt_ite:
  # LOCAL FORK at pipes/story/scripts/build_diary_prompt_ite.coffee.
  # CWD/scripts/ wins over EXEC/scripts/, so this override picks up the
  # forked step that folds story_spine_json into the prompt.
  run: build_diary_prompt_ite.coffee
  depends_on: [collect_diary_kag_ite, scene_planner]
  needs: [story_parts, diary_kag, story_spine_json, story_beats_json, scene_plan_json]
  makes: [diary_prompt_text]
  # Chunk tactic lives HERE now: build_diary_prompt_ite folds each event's
  # matched story passages (Jim's own words) into diary_prompt_text, which both
  # generators consume. include_chunk_passages = UI toggle (checked = chunks on,
  # unchecked = cues only); chunk_excerpt_chars caps each passage (0 = full).
  include_chunk_passages: [ UI_checkbox, true ]
  chunk_excerpt_chars: 700

generate_diary_with_adapter_ite:
  run: diary_ite/generate_diary_with_adapter_ite.coffee
  depends_on: [never]
  needs: [story_parts, diary_prompt_text]
  makes: [diary_adapted_raw, diary_adapted_meta, diary_adapted_text]
  # Adapter picker (UI dropdown). Lists build/adapter* dirs + checkpoints + a
  # base option; defaults to build/adapter. Empty value ('(base)') = no adapter.
  adapter_path: [ UI_dropdown, adapters, build/adapter ]
  quantized_model_dir: build/model4
  llm:
    maxTokens: 2000
    temperature: 0.7

generate_diary_without_adapter_ite:
  run: diary_ite/generate_diary_without_adapter_ite.coffee
  depends_on: [build_diary_prompt_ite]
  needs: [story_parts, diary_prompt_text]
  makes: [diary_base_raw, diary_base_meta, diary_base_text]
  quantized_model_dir: build/model4
  llm:
    maxTokens: 2000
    temperature: 0.7
