# =====================================================================
#   celarien_run.yaml — peer-side Celarien pipeline
# =====================================================================
#
#   Runs on each peer pipe (mac-mini). Consumes two artifacts scp-
#   pushed by the puppeteer's celarien_prep recipe (celarien_fanout_ite
#   step):
#
#     <CWD>/params/celarien_directives.jsonl
#     <CWD>/params/celarien_filled_arc.yaml
#
#   Then runs:
#     celarien_generate_ite    → per-chapter actuals (LLM generation)
#     celarien_audit_ite       → per-chapter audit + regen triggers
#
#   Grand-scheme step boundary:
#     puppeteer:  spine → directive → fan-out (celarien_prep)
#     peer:                           generate → audit (celarien_run)
#
#   Fires when queue_run_ite on the puppeteer dispatches a queue entry
#   with recipe=celarien_run to this pipe.

run:
  # Model paths are pipe-level facts. The pipe's override.yaml MUST
  # set run.loraLand (base) and run.quantized_dir (quantized). See
  # writer/MORNING.md — 2026-09-21 the recipe stops manufacturing
  # paths via ${MODELS}/${run.model}; step blocks below only *point
  # to* run.quantized_dir by name.
  output_dir: out
  data_dir:   data

artifacts:
  # Source-only inputs pushed by puppeteer's celarien_fanout_ite.
  # These are declared with canonical artifact NAMES + source: file
  # paths, so peer steps read via the same L.need keys the puppeteer
  # uses (celarien_directives_jsonl / celarien_filled_arc_json).
  celarien_directives_jsonl:
    source: params/celarien_directives.jsonl
  celarien_filled_arc_json:
    source: params/celarien_filled_arc.yaml

  # Peer outputs.
  celarien_chapter_actuals_json:
    target: out/celarien_chapter_actuals.yaml
  celarien_audit_json:
    target: out/celarien_audit.yaml

# =====================================================================
# Steps.
# =====================================================================

celarien_generate_ite:
  run: celarien_generate_ite.coffee
  depends_on: []
  needs: [celarien_directives_jsonl]
  makes: [celarien_chapter_actuals_json]
  use_celarien_arc: true
  quantized_model_dir: ${run.quantized_dir}
  temperature: 0.85
  top_p: 0.9
  max_tokens: 1500
  # Bounded first run: 3 chapters. Increase in override once
  # per-chapter cost is measured.
  max_chapters: 3

celarien_audit_ite:
  run: celarien_audit_ite.coffee
  depends_on: [celarien_generate_ite]
  needs: [celarien_filled_arc_json, celarien_chapter_actuals_json]
  makes: [celarien_audit_json]
  use_celarien_arc: true
  grader_model_dir: ${run.quantized_dir}
  quantized_model_dir: ${run.quantized_dir}
