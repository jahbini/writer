# =====================================================================
#   reembed_clean.yaml  —  clean semantic re-embed of story chunks (for RAG)
# =====================================================================
#   Re-embeds every story chunk's RAW text (no classification prompt) so
#   RAG retrieval ranks by content instead of noise. As of 2026-09-11
#   embeddings live in the sqlite `kag_embeddings_clean` table (was
#   build/chunk_embeddings_clean.jsonl). Retrievers (prompt_llm with
#   rag_top_k > 0) query the table via `kagAllCleanEmbeddings.jsonl`.
#
#   Pending-work list also comes from sqlite (view
#   `storiesMissingCleanEmbeddings`), so oracle and reembed share the
#   same source of truth — no file-based dedup, no cache-poisoning.

run:
  # 2026-09-21: each pipe embeds its own chunks with its own model
  # (run.quantized_dir), so the pipe's SAT/eval score reflects the
  # pipe's own retrieval quality end-to-end — not the retrieval
  # quality of some other model piggybacked in.
  #
  # Historical note: this recipe used to pin
  # `run.model: Qwen/Qwen3-4B-Instruct-2507` and interpolate
  # `${MODELS}/${run.model}-mlx4`, which meant every pipe ran the
  # 4B embedder over the same jim.md chunks and stored byte-identical
  # kag_embeddings_clean rows. That was N-fold redundant computation
  # AND leaked a foreign model's retrieval quality into every pipe's
  # eval score. Both problems are gone as of this migration.
  output_dir: out
  data_dir: data

artifacts:
  # Batch progress signal — reembed_chunks_clean writes the count of
  # stories still pending after the current batch. Puppeteer's queue
  # driver reads this via the business-truth verifier.
  reembed_remaining_count:
    target: out/reembed_remaining_count.json

reembed_chunks_clean:
  run: prompt_llm/reembed_chunks_clean.coffee
  depends_on: []
  needs: []
  makes: [reembed_remaining_count]
  quantized_model_dir: ${run.quantized_dir}
  # Batch size: matches oracle_ask_sqlite.batch_size so oracle and
  # reembed march in lockstep — 4 stories oracled = 4 stories reembedded.
  # A crash costs at most 4 stories of work in either step.
  batch_size: 4
