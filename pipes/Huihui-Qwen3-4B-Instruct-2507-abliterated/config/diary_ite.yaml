# =====================================================================
#   diary_ite.yaml — PIPE-LOCAL for Huihui-Qwen3-4B-Instruct-2507-abliterated
# =====================================================================
#   Iterative diary-event generation. Walks the curated story library,
#   selects diary-worthy events, builds prompts + KAG corpus, then
#   generates diary entries — with and without the trained LoRA adapter
#   — for comparative evaluation.
#
#   The `generate_diary_with_adapter_ite` step has `depends_on: [never]`
#   — it does NOT fire in an automatic pipeline run. Trigger it via
#   the UI's per-step "restart" button once you've picked a story and
#   adapter from the dropdowns. This is intentional (see memory:
#   "never means never" — foundational, don't flip the gate).
#
#   Pinned to $MODELS for this pipe's base model. Adapter stays
#   pipe-local under build/adapter.

run:
  output_dir: out
  data_dir: data
  training_dir: build/train
  loraLand: ${MODELS}/huihui-ai/Huihui-Qwen3-4B-Instruct-2507-abliterated
  debug_s: false
  debug_mlx: false
  debug_sql: false

artifacts:
  story_library:
    target: out/story_library.json
  story_recipe:
    target: out/story_recipe.json
  story_parts:
    target: out/story_parts.json
  diary_kag:
    target: out/diary_kag.json
  diary_prompt_text:
    target: out/diary_prompt.txt
  diary_adapted_raw:
    target: out/diary_adapted_raw.txt
  diary_base_raw:
    target: out/diary_base_raw.txt
  diary_adapted_meta:
    target: out/diary_adapted_meta.json
  diary_base_meta:
    target: out/diary_base_meta.json
  diary_adapted_text:
    target: out/diary_adapted.txt
  diary_base_text:
    target: out/diary_base.txt

load_library:
  run: story/load_library.coffee
  depends_on: []
  needs: []
  makes: [story_library]
  library_file: data/jim_story_library.yaml

select_story_recipe:
  run: story/select_story_recipe.coffee
  depends_on: [load_library]
  needs: [story_library]
  makes: [story_recipe]
  scene: [ UI_dropdown, data/jim_story_library.yaml/library/scenes ]
  arrival: [ UI_dropdown, data/jim_story_library.yaml/library/characters ]
  disturbance: [ UI_dropdown, data/jim_story_library.yaml/library/disturbances ]
  reflection: [ UI_dropdown, data/jim_story_library.yaml/library/reflections ]
  realization: [ UI_dropdown, data/jim_story_library.yaml/library/realizations ]

resolve_story_parts:
  run: story/resolve_story_parts.coffee
  depends_on: [select_story_recipe]
  needs: [story_library, story_recipe]
  makes: [story_parts]

collect_diary_kag_ite:
  run: diary_ite/collect_diary_kag_ite.coffee
  depends_on: [resolve_story_parts]
  needs: [story_parts]
  makes: [diary_kag]
  per_event_match_limit: 3
  scene_emotion: [ UI_dropdown, db/kag_keywords, "" ]
  arrival_emotion: [ UI_dropdown, db/kag_keywords, "" ]
  disturbance_emotion: [ UI_dropdown, db/kag_keywords, "" ]
  reflection_emotion: [ UI_dropdown, db/kag_keywords, "" ]
  realization_emotion: [ UI_dropdown, db/kag_keywords, "" ]

build_diary_prompt_ite:
  run: diary_ite/build_diary_prompt_ite.coffee
  depends_on: [collect_diary_kag_ite]
  needs: [story_parts, diary_kag]
  makes: [diary_prompt_text]
  # Chunk tactic: build_diary_prompt_ite folds each event's matched
  # story passages (Jim's own words) into diary_prompt_text, which
  # both generators consume. include_chunk_passages: UI toggle.
  include_chunk_passages: [ UI_checkbox, true ]
  chunk_excerpt_chars: 700

# MANUAL step — depends_on: [never] means the automatic runner won't
# fire this. Trigger from the UI once story + adapter picked.
generate_diary_with_adapter_ite:
  run: diary_ite/generate_diary_with_adapter_ite.coffee
  depends_on: [never]
  needs: [story_parts, diary_prompt_text]
  makes: [diary_adapted_raw, diary_adapted_meta, diary_adapted_text]
  # Adapter picker (UI dropdown). Lists build/adapter* dirs +
  # checkpoints + a base option; defaults to build/adapter (the
  # freshly-trained current adapter). Empty value ('(base)') = no
  # adapter, useful for A/B against the without-adapter step.
  adapter_path: [ UI_dropdown, adapters, build/adapter ]
  quantized_model_dir: ${MODELS}/huihui-ai/Huihui-Qwen3-4B-Instruct-2507-abliterated-mlx4
  llm:
    maxTokens: 2000
    temperature: 0.7

generate_diary_without_adapter_ite:
  run: diary_ite/generate_diary_without_adapter_ite.coffee
  depends_on: [build_diary_prompt_ite]
  needs: [story_parts, diary_prompt_text]
  makes: [diary_base_raw, diary_base_meta, diary_base_text]
  quantized_model_dir: ${MODELS}/huihui-ai/Huihui-Qwen3-4B-Instruct-2507-abliterated-mlx4
  llm:
    maxTokens: 2000
    temperature: 0.7
