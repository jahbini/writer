# =====================================================================
#   reset.yaml — PIPE-LOCAL for Huihui-Qwen3-4B-Instruct-2507-abliterated
# =====================================================================
#   Shadows ~/writer/config/reset.yaml. Same 4-step bootstrap chain,
#   plus $MODELS-based path pins for THIS pipe's base model.
#
#   Layout under $MODELS/:
#     huihui-ai/Huihui-Qwen3-4B-Instruct-2507-abliterated/       raw HF download
#     huihui-ai/Huihui-Qwen3-4B-Instruct-2507-abliterated-mlx4/  4-bit MLX
#
#   If you swap the base model in override.yaml, update the paths on
#   `run.loraLand`, `download_model.download_dir`, and the two
#   `quantize_model.*_dir` values below.

run:
  output_dir: out
  data_dir: data
  training_dir: build/train
  loraLand: ${MODELS}/huihui-ai/Huihui-Qwen3-4B-Instruct-2507-abliterated
  debug_s: false
  debug_mlx: false
  debug_sql: false

artifacts:
  stories_md:
    source: data/stories.md
  story_seed_ids:
    target: out/story_seed_ids.json

reset_base_environment_ite:
  run: base_ite/reset_base_environment_ite.coffee
  depends_on: []
  needs: []
  makes: []

download_model:
  run: model/download_model.coffee
  depends_on: [reset_base_environment_ite]
  needs: []
  makes: []
  download_dir: ${MODELS}/huihui-ai/Huihui-Qwen3-4B-Instruct-2507-abliterated

quantize_model:
  run: model/quantize_model.coffee
  depends_on: [download_model]
  needs: []
  makes: []
  src_dir:       ${MODELS}/huihui-ai/Huihui-Qwen3-4B-Instruct-2507-abliterated
  quantized_dir: ${MODELS}/huihui-ai/Huihui-Qwen3-4B-Instruct-2507-abliterated-mlx4
  q_bits: 4

seed_story_sqlite:
  run: kag_oracle_ite/seed_story_sqlite.coffee
  depends_on: [quantize_model]
  needs: [stories_md]
  makes: [story_seed_ids]
