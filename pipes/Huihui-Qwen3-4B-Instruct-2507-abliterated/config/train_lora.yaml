# =====================================================================
#   train_lora.yaml — PIPE-LOCAL for Huihui-Qwen3-4B-Instruct-2507-abliterated
# =====================================================================
#   Trains a LoRA adapter using (plain → jim) chat-formatted pairs
#   built from chunk_simplifications (populated by oracle_ite's
#   rewrite pass). Replaces the shipped completion-style shape.
#
#   Chain: select_lora_stories_ite → build_lora_pairs_ite →
#          run_lora_train_ite → record_lora_training_ite
#
#   Sweet-spot config: rank 8 / alpha 16 / dropout 0.05 / top-8
#   blocks / natural-EOS rows / maxSeqLength 640 / lr 1e-5. See
#   memory/project_jim_lora_lr.md for why lr matters — 2e-4
#   collapses the adapter via EOT gradient monopoly.

run:
  output_dir: out
  data_dir: data
  training_dir: build/train
  loraLand: ${MODELS}/huihui-ai/Huihui-Qwen3-4B-Instruct-2507-abliterated

artifacts:
  lora_cycle_state:
    target: out/lora_cycle_state.json
  lora_remaining_count:
    target: out/lora_remaining_count.json
  selected_story_ids:
    target: out/selected_story_ids.json
  lora_stdout:
    target: out/lora_train.txt
  lora_run_record:
    target: out/lora_run_record.json
  trained_story_ids:
    target: out/trained_story_ids.json

select_lora_stories_ite:
  run: lora_ite/select_lora_stories_ite.coffee
  depends_on: []
  needs: []
  makes: [lora_cycle_state, lora_remaining_count, selected_story_ids]
  # All stories in one selection (169 available). Single full-corpus train.
  batch_size: 200

# Emits chat-formatted (plain → jim) pairs from chunk_simplifications
# joined with the original story chunks. See the script for the
# preamble filter and row shape.
build_lora_pairs_ite:
  run: build_lora_pairs_ite.coffee
  depends_on: [select_lora_stories_ite]
  needs: [selected_story_ids]
  makes: [train_rows, valid_rows, test_rows]
  # model_dir used only for tokenizer eot_token
  model_dir: ${MODELS}/huihui-ai/Huihui-Qwen3-4B-Instruct-2507-abliterated-mlx4
  # Drop rows whose cleaned simple_text is shorter than this many chars
  # (Qwen sometimes emits a preamble-only response with no real rewrite).
  min_simple_chars: 100
  # system_prompt: override the default in the script if you want a
  # different framing for the jim-voice instruction.

run_lora_train_ite:
  run: lora_ite/run_lora_train_ite.coffee
  depends_on: [build_lora_pairs_ite]
  needs: [lora_cycle_state, selected_story_ids, train_rows, valid_rows, test_rows]
  makes: [lora_stdout, lora_run_record]
  test_only: false
  quantized_model_dir: ${MODELS}/huihui-ai/Huihui-Qwen3-4B-Instruct-2507-abliterated-mlx4
  # Adapters stay pipe-local (user's call — not moved into $MODELS).
  adapter_path: build/adapter
  resume_adapter_file: build/adapter/adapters.safetensors
  llm:
    batchSize: 1
    iters: 300
    maxSeqLength: 640
    learningRate: 0.00001
    loraRank: 8
    loraAlpha: 16
    loraDropout: 0.05
    loraLayers: 8
    stepsPerReport: 10
    saveEvery: 100

record_lora_training_ite:
  run: lora_ite/record_lora_training_ite.coffee
  depends_on: [run_lora_train_ite]
  needs: [lora_run_record]
  makes: [trained_story_ids]
