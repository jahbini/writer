ch_0001:
  class: port_trade
  aperture: none
  directive: >-
    Chapter-local color is fine; do not mint cross-chapter obligations, debts, wounds, or deaths.


    The chapter's frame: The stranger passing through: no standing, no home ground — survival by
    reserve, courtesy, and not settling into what is not one's own.


    What is wanted here: shelter, passage, and small wins on foreign ground


    What holds it back: modesty; a stranger's arrogance is quickly punished


    What is arriving: Following: leadership by adapting — to gain followers one must first learn to
    follow, and choose whom to follow with care.


    Amazons aboard: Archers of the Pontic steppe, hired on the grain run. Sails by day, bowstrings
    when it goes wrong; the masthead is theirs. The athlete passenger: A strong and amoral athlete
    working the games circuit, aboard between contests. Magnificent body, vacant loyalties.


    Captain's face to the world: Reads as whim and luck: decisions announced without argument,
    headings changed on no visible evidence, and yet the ship comes home.


    Scenes to draw on: Shrine smoke rising above the port town | Grain dust and crane ropes over a
    crowded quay


    Character beats to use: weighs the moment in silence before answering | looks up past the
    rigging as if reading something there


    Disturbances at hand: A price so good it has to be a trap or a grief


    Captain's inner sounding: An easy harbor after hard water; I like it, and I say so


    Captain's bearing: Breaking a truce is a heading you cannot sail back from


    The success this chapter would look like: Shelter and property gained, but 'my heart is not
    glad'; not home.


    How fortune actually lands: a modest gain that holds
ch_0002:
  class: games
  aperture: none
  directive: >-
    Chapter-local color is fine; do not mint cross-chapter obligations, debts, wounds, or deaths.


    The chapter's frame: The small prevails: a time for modest tasks done extra-carefully — the bird
    should fly low; the grand gesture will miscarry.


    What is wanted here: to accomplish what the narrow moment allows


    What holds it back: keeping below; conscientiousness over ambition


    Leaving behind: The stranger passing through: no standing, no home ground — survival by reserve,
    courtesy, and not settling into what is not one's own.


    What is arriving: Limitation: the measures and joints that give life form — thrift, rules, and
    boundaries, which turn bitter if made absolute.


    Amazons aboard: Archers of the Pontic steppe, hired on the grain run. Sails by day, bowstrings
    when it goes wrong; the masthead is theirs. The athlete passenger: A strong and amoral athlete
    working the games circuit, aboard between contests. Magnificent body, vacant loyalties.


    Captain's face to the world: Reads as whim and luck: decisions announced without argument,
    headings changed on no visible evidence, and yet the ship comes home.


    Scenes to draw on: Dawn watch changing hands, dew on the steering oars | Weather turning ugly
    off a lee shore


    Character beats to use: restrings her bow without looking down from the masthead | looks up past
    the rigging as if reading something there


    Disturbances at hand: A sacred-truce ribbon found torn on the quay


    Captain's inner sounding: The hold is full and the profit is fair, and I do not like it


    Captain's bearing: Breaking a truce is a heading you cannot sail back from


    The success this chapter would look like: Meeting the situation without forcing it; constantly
    on guard.


    How fortune actually lands: a hard blow that changes what the ship carries home
ch_0003:
  class: pirates
  aperture: none
  directive: >-
    Chapter-local color is fine; do not mint cross-chapter obligations, debts, wounds, or deaths.


    The chapter's frame: Organized force: a group effort needs discipline, a legitimate leader, and
    a cause the rank and file believe in.


    What is wanted here: to mobilize people toward one aim


    What holds it back: order and legitimacy against mission rot


    Leaving behind: The small prevails: a time for modest tasks done extra-carefully — the bird
    should fly low; the grand gesture will miscarry.


    What is arriving: Gathering together: a great assembly around a legitimate center — collective
    moments breed both unity and the accidents of crowds.


    Amazons aboard: Archers of the Pontic steppe, hired on the grain run. Sails by day, bowstrings
    when it goes wrong; the masthead is theirs. The athlete passenger: A strong and amoral athlete
    working the games circuit, aboard between contests. Magnificent body, vacant loyalties.


    Captain's face to the world: Reads as whim and luck: decisions announced without argument,
    headings changed on no visible evidence, and yet the ship comes home.


    Scenes to draw on: A sail sighted from the masthead, too far to name | Lamplight on bronze
    gearwork in the aft cabin


    Character beats to use: restrings her bow without looking down from the masthead | looks up past
    the rigging as if reading something there


    Disturbances at hand: A friendly flag on a hull rigged for taking


    Captain's inner sounding: An easy harbor after hard water; I like it, and I say so


    Captain's bearing: The cargo can be replaced; the crew cannot; that way is up


    The success this chapter would look like: An orderly retreat is not defeat; it preserves the
    force.


    How fortune actually lands: loss the crew must absorb
